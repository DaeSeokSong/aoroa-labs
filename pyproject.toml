[project]
name = "aoroa-labs"
version = "0.1.0"
description = "AOROA LABS AI/ML 연구원 채용 과제"
requires-python = ">=3.10"
dependencies = [
    # 데이터 처리
    "pandas>=2.0",
    "numpy>=1.24",
    # 머신러닝
    "scikit-learn>=1.3",
    # 시계열 예측
    "prophet>=1.1",
    "xgboost>=2.0",
    # 시각화
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "plotly>=5.0",
    # 유틸
    "pyarrow>=14.0",        # pandas parquet 성능
    "holidays>=0.40",       # prophet 한국 공휴일
]

[dependency-groups]
dev = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
]
